name: Build Static PHP CLI (Workflows Compiler)

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: 'PHP Version to build (e.g. 8.4, 8.3, 8.2)'
        required: false
        default: '8.4'
        type: string
      extensions:
        description: 'Comma-separated extensions list (leave empty to use the built-in per-platform list, see static-php-cli docs)'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
  release:
    types: [ created ]

env:
  MEMORY_LIMIT: "4G"
  MAX_EXEC_TIME: "0"
  TIMEZONE: "Asia/Shanghai"
  # 三平台（Linux / macOS / Windows）均支持的扩展，含 ODBC / PDO_ODBC / 各种数据库驱动
  COMMON_EXTENSIONS: "amqp,apcu,bcmath,brotli,bz2,calendar,ctype,curl,dba,dom,ds,exif,fileinfo,filter,ftp,gd,gettext,gmp,iconv,igbinary,intl,libxml,lz4,maxminddb,mbregex,mbstring,msgpack,mongodb,mysqli,mysqlnd,odbc,opcache,openssl,pdo,pdo_mysql,pdo_odbc,pdo_sqlite,pdo_sqlsrv,phar,rar,readline,redis,session,shmop,simdjson,simplexml,soap,sockets,sodium,sqlite3,sqlsrv,ssh2,swow,sysvshm,tidy,tokenizer,xml,xmlreader,xmlwriter,xsl,xz,yaml,zip,zlib,zstd"
  # 仅 Linux / macOS 支持（Windows 上 pgsql 依赖 meson/python，CI 拉取 nuget 失败；其余平台专属）
  UNIX_EXTRA_EXTENSIONS: "pcntl,pdo_pgsql,pgsql,posix,sysvmsg,sysvsem,ldap,imap,memcached,snmp,uuid"
  # 仅 Linux 支持
  LINUX_EXTRA_EXTENSIONS: "inotify"

jobs:
  build:
    name: Build PHP ${{ inputs.php-version || '8.4' }} (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    env:
      # 可选：在仓库 Secrets 添加 SPC_GITHUB_TOKEN（可读公开仓库的 PAT），
      # 避免 spc 下载依赖时被 GitHub API 匿名限流。不要用 secrets.GITHUB_TOKEN，
      # 它只能访问当前仓库，访问其他仓库会 404。
      GITHUB_TOKEN: ${{ secrets.SPC_GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows x64
            spc-url: https://dl.static-php.dev/v3/spc-bin/nightly/spc-windows-x64.exe
            spc-bin: spc.exe
            artifact-name: php-8.4-windows-cli
            output-bin: buildroot/bin/php.exe
          - os: ubuntu-latest
            os-name: Linux x86_64
            spc-url: https://dl.static-php.dev/v3/spc-bin/nightly/spc-linux-x86_64
            spc-bin: spc
            artifact-name: php-8.4-linux-x86_64-cli
            output-bin: buildroot/bin/php
          - os: macos-13
            os-name: macOS x86_64 (Intel)
            spc-url: https://dl.static-php.dev/v3/spc-bin/nightly/spc-macos-x86_64
            spc-bin: spc
            artifact-name: php-8.4-macos-x86_64-cli
            output-bin: buildroot/bin/php
          - os: macos-latest
            os-name: macOS ARM64 (Apple Silicon)
            spc-url: https://dl.static-php.dev/v3/spc-bin/nightly/spc-macos-aarch64
            spc-bin: spc
            artifact-name: php-8.4-macos-arm64-cli
            output-bin: buildroot/bin/php

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============ Windows Steps ============
      - name: Setup PHP (for tools, Windows)
        if: runner.os == 'Windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Download static-php-cli (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "${{ matrix.spc-url }}" -OutFile "${{ matrix.spc-bin }}"
          .\${{ matrix.spc-bin }} --version
          .\${{ matrix.spc-bin }} doctor --auto-fix

      - name: Generate craft.yml (Windows)
        if: runner.os == 'Windows'
        run: |
          $ext = "${{ inputs.extensions }}"
          if ([string]::IsNullOrWhiteSpace($ext)) { $ext = $env:COMMON_EXTENSIONS }
          @"
          php-version: ${{ inputs.php-version || '8.4' }}
          extensions: $ext
          sapi:
            - cli
          download-options:
            parallel: 10
            retry: 5
            prefer-binary: true
            # GitHub API 经常限流/故障，这里用固定直链绕过 api.github.com
            custom-url:
              - "zlib:https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
              - "librabbitmq:https://github.com/alanxz/rabbitmq-c/archive/refs/tags/v0.18.1.tar.gz"
              - "libpng:https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.59.tar.gz"
              - "libxml2:https://github.com/GNOME/libxml2/archive/refs/tags/v2.15.4.tar.gz"
              - "tidy:https://github.com/htacg/tidy-html5/archive/refs/tags/5.8.0.tar.gz"
              - "brotli:https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz"
              - "ext-brotli:https://github.com/kjdev/php-ext-brotli/archive/refs/tags/0.21.1.tar.gz"
              - "ext-ssh2:https://github.com/php/pecl-networking-ssh2/archive/refs/tags/1.6.0.tar.gz"
              - "ext-swow:https://github.com/swow/swow/archive/refs/tags/v1.6.2.tar.gz"
              - "ext-zstd:https://github.com/kjdev/php-ext-zstd/archive/refs/tags/0.18.0.tar.gz"
              - "net-snmp:https://github.com/net-snmp/net-snmp/archive/refs/tags/v5.9.5.2.tar.gz"
              - "postgresql:https://github.com/postgres/postgres/archive/refs/tags/REL_18_6.tar.gz"
              - "libmemcached:https://github.com/awesomized/libmemcached/archive/refs/tags/1.1.4.tar.gz"
              - "ext-imap:https://github.com/php/pecl-mail-imap/archive/refs/tags/1.0.3.tar.gz"
              - "ext-rar:https://github.com/cataphract/php-rar/releases/download/v4.3.1/rar-4.3.1.tgz"
              - "openssl:https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz"
              - "libssh2:https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.1/libssh2-1.11.1.tar.gz"
              - "nghttp2:https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz"
              - "zstd:https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
              - "curl:https://github.com/curl/curl/releases/download/curl-8_23_0/curl-8.23.0.tar.xz"
              - "icu:https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz"
              - "liblz4:https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz"
              - "libmaxminddb:https://github.com/maxmind/libmaxminddb/releases/download/1.14.1/libmaxminddb-1.14.1.tar.gz"
              - "onig:https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz"
              - "libsodium:https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz"
              - "xz:https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
              - "libyaml:https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz"
              - "libzip:https://github.com/nih-at/libzip/releases/download/v1.12.1/libzip-1.12.1.tar.xz"
              - "ext-mongodb:https://github.com/mongodb/mongo-php-driver/releases/download/2.5.6/mongodb-2.5.6.tgz"
              - "ext-amqp:https://pecl.php.net/get/amqp-2.2.0.tgz"
              - "ext-apcu:https://pecl.php.net/get/apcu-5.1.28.tgz"
              - "ext-igbinary:https://pecl.php.net/get/igbinary-3.2.16.tgz"
              - "ext-msgpack:https://pecl.php.net/get/msgpack-3.0.1.tgz"
              - "ext-redis:https://pecl.php.net/get/redis-6.3.0.tgz"
              - "ext-zip:https://pecl.php.net/get/zip-1.22.8.tgz"
              - "ext-memcached:https://pecl.php.net/get/memcached-3.4.0.tgz"
              - "ext-inotify:https://pecl.php.net/get/inotify-3.0.1.tgz"
              - "ext-uuid:https://pecl.php.net/get/uuid-1.3.0.tgz"
              - "ext-maxminddb:https://pecl.php.net/get/maxminddb-1.14.0.tgz"
              - "ext-simdjson:https://pecl.php.net/get/simdjson-4.0.0.tgz"
              - "ext-sqlsrv:https://pecl.php.net/get/sqlsrv-5.13.3.tgz"
              - "ext-pdo_sqlsrv:https://pecl.php.net/get/pdo_sqlsrv-5.13.3.tgz"
          "@ > craft.yml
          Get-Content craft.yml

      - name: Build PHP CLI via craft (Windows)
        if: runner.os == 'Windows'
        run: |
          for ($i = 1; $i -le 3; $i++) {
            .\${{ matrix.spc-bin }} craft
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "craft failed (attempt $i/3), retry in 60s..."
            Start-Sleep -Seconds 60
          }
          exit 1

      # ============ Unix Steps (Linux/macOS) ============
      - name: Setup PHP (for tools, Unix)
        if: runner.os != 'Windows'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Install pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Download static-php-cli (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -L "${{ matrix.spc-url }}" -o "${{ matrix.spc-bin }}"
          chmod +x "${{ matrix.spc-bin }}"
          ./${{ matrix.spc-bin }} --version
          ./${{ matrix.spc-bin }} doctor --auto-fix

      - name: Generate craft.yml (Unix)
        if: runner.os != 'Windows'
        run: |
          EXT="${{ inputs.extensions }}"
          if [ -z "$EXT" ]; then
            EXT="${COMMON_EXTENSIONS},${UNIX_EXTRA_EXTENSIONS}"
            if [ "$RUNNER_OS" = "Linux" ]; then
              EXT="${EXT},${LINUX_EXTRA_EXTENSIONS}"
            fi
          fi
          cat > craft.yml << CRAFT_EOF
          php-version: ${{ inputs.php-version || '8.4' }}
          extensions: ${EXT}
          sapi:
            - cli
          download-options:
            parallel: 10
            retry: 5
            prefer-binary: true
            # GitHub API 经常限流/故障，这里用固定直链绕过 api.github.com
            custom-url:
              - "zlib:https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
              - "librabbitmq:https://github.com/alanxz/rabbitmq-c/archive/refs/tags/v0.18.1.tar.gz"
              - "libpng:https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.59.tar.gz"
              - "libxml2:https://github.com/GNOME/libxml2/archive/refs/tags/v2.15.4.tar.gz"
              - "tidy:https://github.com/htacg/tidy-html5/archive/refs/tags/5.8.0.tar.gz"
              - "brotli:https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz"
              - "ext-brotli:https://github.com/kjdev/php-ext-brotli/archive/refs/tags/0.21.1.tar.gz"
              - "ext-ssh2:https://github.com/php/pecl-networking-ssh2/archive/refs/tags/1.6.0.tar.gz"
              - "ext-swow:https://github.com/swow/swow/archive/refs/tags/v1.6.2.tar.gz"
              - "ext-zstd:https://github.com/kjdev/php-ext-zstd/archive/refs/tags/0.18.0.tar.gz"
              - "net-snmp:https://github.com/net-snmp/net-snmp/archive/refs/tags/v5.9.5.2.tar.gz"
              - "postgresql:https://github.com/postgres/postgres/archive/refs/tags/REL_18_6.tar.gz"
              - "libmemcached:https://github.com/awesomized/libmemcached/archive/refs/tags/1.1.4.tar.gz"
              - "ext-imap:https://github.com/php/pecl-mail-imap/archive/refs/tags/1.0.3.tar.gz"
              - "ext-rar:https://github.com/cataphract/php-rar/releases/download/v4.3.1/rar-4.3.1.tgz"
              - "openssl:https://github.com/openssl/openssl/releases/download/openssl-3.6.5/openssl-3.6.5.tar.gz"
              - "libssh2:https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.1/libssh2-1.11.1.tar.gz"
              - "nghttp2:https://github.com/nghttp2/nghttp2/releases/download/v1.71.0/nghttp2-1.71.0.tar.xz"
              - "zstd:https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
              - "curl:https://github.com/curl/curl/releases/download/curl-8_23_0/curl-8.23.0.tar.xz"
              - "icu:https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz"
              - "liblz4:https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz"
              - "libmaxminddb:https://github.com/maxmind/libmaxminddb/releases/download/1.14.1/libmaxminddb-1.14.1.tar.gz"
              - "onig:https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz"
              - "libsodium:https://github.com/jedisct1/libsodium/releases/download/1.0.22-RELEASE/libsodium-1.0.22.tar.gz"
              - "xz:https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
              - "libyaml:https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz"
              - "libzip:https://github.com/nih-at/libzip/releases/download/v1.12.1/libzip-1.12.1.tar.xz"
              - "ext-mongodb:https://github.com/mongodb/mongo-php-driver/releases/download/2.5.6/mongodb-2.5.6.tgz"
              - "ext-amqp:https://pecl.php.net/get/amqp-2.2.0.tgz"
              - "ext-apcu:https://pecl.php.net/get/apcu-5.1.28.tgz"
              - "ext-igbinary:https://pecl.php.net/get/igbinary-3.2.16.tgz"
              - "ext-msgpack:https://pecl.php.net/get/msgpack-3.0.1.tgz"
              - "ext-redis:https://pecl.php.net/get/redis-6.3.0.tgz"
              - "ext-zip:https://pecl.php.net/get/zip-1.22.8.tgz"
              - "ext-memcached:https://pecl.php.net/get/memcached-3.4.0.tgz"
              - "ext-inotify:https://pecl.php.net/get/inotify-3.0.1.tgz"
              - "ext-uuid:https://pecl.php.net/get/uuid-1.3.0.tgz"
              - "ext-maxminddb:https://pecl.php.net/get/maxminddb-1.14.0.tgz"
              - "ext-simdjson:https://pecl.php.net/get/simdjson-4.0.0.tgz"
              - "ext-sqlsrv:https://pecl.php.net/get/sqlsrv-5.13.3.tgz"
              - "ext-pdo_sqlsrv:https://pecl.php.net/get/pdo_sqlsrv-5.13.3.tgz"
          CRAFT_EOF
          cat craft.yml

      - name: Build PHP CLI via craft (Unix)
        if: runner.os != 'Windows'
        run: |
          for i in 1 2 3; do
            ./${{ matrix.spc-bin }} craft && exit 0
            echo "craft failed (attempt $i/3), retry in 60s..."
            sleep 60
          done
          exit 1

      # ============ 把 php.ini 放到 exe 同目录 ============
      - name: Generate php.ini next to binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $iniDir = Split-Path "${{ matrix.output-bin }}" -Parent
          @"
          memory_limit = ${{ env.MEMORY_LIMIT }}
          max_execution_time = ${{ env.MAX_EXEC_TIME }}
          date.timezone = ${{ env.TIMEZONE }}
          "@ | Out-File -Encoding ascii "$iniDir\php.ini"
          Get-Content "$iniDir\php.ini"

      - name: Generate php.ini next to binary (Unix)
        if: runner.os != 'Windows'
        run: |
          iniDir=$(dirname "${{ matrix.output-bin }}")
          cat > "$iniDir/php.ini" << INI_EOF
          memory_limit = ${{ env.MEMORY_LIMIT }}
          max_execution_time = ${{ env.MAX_EXEC_TIME }}
          date.timezone = ${{ env.TIMEZONE }}
          INI_EOF
          cat "$iniDir/php.ini"

      # ============ Common Steps ============
      - name: Verify Build
        run: |
          ${{ (runner.os == 'Windows' && '.\' || './') }}${{ matrix.output-bin }} -v
          ${{ (runner.os == 'Windows' && '.\' || './') }}${{ matrix.output-bin }} -r "echo ini_get('memory_limit'), PHP_EOL;"

      # 同时上传 exe 和它旁边的 php.ini（保持同目录结构）
      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.output-bin }}
            buildroot/bin/php.ini

      - name: Upload Artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.output-bin }}
            buildroot/bin/php.ini

      - name: Upload to Release
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.output-bin }}
          asset_name: ${{ matrix.artifact-name }}
          tag: ${{ github.ref }}
          overwrite: true
